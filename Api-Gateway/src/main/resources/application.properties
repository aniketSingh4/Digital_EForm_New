# ============================================
# Application Configuration
# ============================================
spring.application.name=Api-Gateway
server.port=7070

# ============================================
# Gateway Routes (NO COMMENTS IN ROUTE DEFINITIONS!)
# ============================================

# Route 0: Authentication Service
spring.cloud.gateway.routes[0].id=authentication-service
spring.cloud.gateway.routes[0].uri=http://localhost:8089
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: PM Reports Service
spring.cloud.gateway.routes[1].id=pm-reports
spring.cloud.gateway.routes[1].uri=http://localhost:8090
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/pm_reports/**

# Route 2: Previsit Reports Service
spring.cloud.gateway.routes[2].id=previsit-reports
spring.cloud.gateway.routes[2].uri=http://localhost:8088
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/previsit-reports/**

# Route 3: Calibration Reports Service
spring.cloud.gateway.routes[3].id=calibration-reports
spring.cloud.gateway.routes[3].uri=http://localhost:8087
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/calibration-reports/**

# Route 4: Installation Reports Service
spring.cloud.gateway.routes[4].id=installation-reports
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reports/**

# ============================================
# Logging Configuration
# ============================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.org.springframework.web=DEBUG

# ============================================
# Actuator Configuration - FIXED
# ============================================
# Expose ALL actuator endpoints
management.endpoints.web.exposure.include=*

# Enable gateway specific endpoints
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always
management.endpoint.routes.enabled=true