spring.application.name=Pre-Visit-Report-Form

# Database Configuration - Use environment variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================================
# STATIC RESOURCES - FOR IMAGES
# ========================================
# Enable static resource serving
spring.web.resources.add-mappings=true

# Add uploads directory as a static resource location
# Use an absolute path or a well-defined path in production
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:./uploads/

# Cache control for static resources (1 hour in production, consider longer)
spring.web.resources.cache.period=3600

# ========================================
# MULTIPART FILE UPLOAD
# ========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Use system temp directory - files will be lost on restart
spring.servlet.multipart.location=${java.io.tmpdir}/uploads/temp

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.florosense.pre_visit_report=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ========================================
# SERVER
# ========================================
server.port=${PORT:8080}
server.address=0.0.0.0

# ========================================
# DB Retry Logic
# ========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT (must match Authentication-System)
jwt.secret=${JWT_SECRET}
