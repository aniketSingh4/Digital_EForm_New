spring.application.name=Pre-Visit-Report-Form

# Database Configuration - Use environment variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================================
# MULTIPART FILE UPLOAD (Minimal)
# ========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Use system temp directory - files will be lost on restart
spring.servlet.multipart.location=${java.io.tmpdir}/uploads/temp

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.florosense.pre_visit_report=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ========================================
# SERVER
# ========================================
server.port=${PORT:8080}
server.address=0.0.0.0