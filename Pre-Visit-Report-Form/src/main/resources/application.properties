spring.application.name=Pre-Visit-Report-Form
server.port=8088

# PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/Digital_EForm
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========================================
# STATIC RESOURCES - FOR IMAGES
# ========================================
# Enable static resource serving
#spring.web.resources.add-mappings=true

# Add uploads directory as a static resource location
#spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:uploads/

# Cache control for static resources (1 hour)
#spring.web.resources.cache.period=3600

# ========================================
# MULTIPART FILE UPLOAD
# ========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Temporary location for multipart uploads
spring.servlet.multipart.location=uploads/temp

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ========================================
# DEVTools
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# ========================================
# LOGGING
# ========================================
logging.level.com.florosense.pre_visit_report.controller.ImageController=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n