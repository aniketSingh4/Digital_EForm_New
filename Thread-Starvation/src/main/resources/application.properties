spring.application.name=Thread-Starvation

# src/main/resources/application.properties
# \u2B50 Disable DataSource auto-configuration for standalone testing
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# \u2B50 Server port
server.port=8083

# \u2B50 Enable thread starvation detection
thread.starvation.enabled=true
thread.starvation.detectionInterval=60000

# \u2B50 HikariCP monitoring (disabled since no DataSource)
thread.starvation.hikari.enabled=false

# \u2B50 Thread pool monitoring
thread.starvation.threadPool.enabled=true

# \u2B50 Clock leap detection
thread.starvation.clockLeap.enabled=true
thread.starvation.clockLeap.maxDeltaThreshold=30000
thread.starvation.clockLeap.warningThreshold=5000
thread.starvation.clockLeap.checkInterval=60000

# \u2B50 Request timing
thread.starvation.requestTiming.enabled=true
thread.starvation.requestTiming.slowRequestThreshold=3000

# \u2B50 Logging
logging.level.com.florosense.thread_starvation=INFO
logging.level.com.florosense.thread_starvation.monitor=DEBUG