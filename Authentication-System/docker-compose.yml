version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: Digital_EForm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/Digital_EForm
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: root
      JWT_SECRET: VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdBbmRWYWxpZGF0aW9uMTIzNDU2Nzg5MA==
      CORS_ALLOWED_ORIGINS: http://localhost:80,http://localhost:5173
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8089
    ports:
      - "80:80"
    depends_on:
      - authentication-service

volumes:
  postgres_data: