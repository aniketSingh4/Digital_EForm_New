spring.application.name=Authentication-System

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mvc.hiddenmethod.filter.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.florosense=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration - Use environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# DevTools - Disabled in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://digitalform.florosense.com}

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Actuator (Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never