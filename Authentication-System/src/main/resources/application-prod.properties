spring.application.name=Authentication-System

# Database Configuration - Use Render's DATABASE_URL environment variable
spring.datasource.driver-class-name=org.postgresql.Driver
# DATABASE_URL will be provided by Render - format: postgresql://user:pass@host:port/db
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable Hidden HTTP Methods
spring.mvc.hiddenmethod.filter.enabled=true

# Logging - Less verbose in production
logging.level.root=INFO
logging.level.com.florosense=DEBUG
logging.level.org.springframework.security=INFO

# JWT Configuration - Use environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# DevTools - Disabled in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Server Configuration
server.port=${PORT:8080}