services:
  auth:
    build:
      context: ./Authentication-System
      dockerfile: dockerfile
    container_name: eform-auth
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - eform

  pm:
    build:
      context: ./PM-Service-Reports
      dockerfile: Dockerfile
    container_name: eform-pm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - eform

  previsit:
    build:
      context: ./Pre-Visit-Report-Form
      dockerfile: Dockerfile
    container_name: eform-previsit
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    volumes:
      - ./data/previsit-uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - eform

  calibration:
    build:
      context: ./Calibration-Report
      dockerfile: Dockerfile
    container_name: eform-calibration
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - eform

  installation:
    build:
      context: ./Installation-Commisioning-Report
      dockerfile: Dockerfile
    container_name: eform-installation
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
    volumes:
      - ./data/installation-uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - eform

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        # Empty VITE_*_SERVICE_URL so the SPA calls same-origin /api.
        VITE_ENABLE_SIGNUP: "false"
    container_name: eform-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eform

  nginx:
    image: nginx:alpine
    container_name: eform-nginx
    restart: unless-stopped
    ports:
      # Public HTTP/HTTPS. Hostinger must allow 80 and 443.
      # UI + APIs: https://digitalform.florosense.com (after Let's Encrypt)
      # IP fallback: http://72.60.74.221/
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      # Snippets are not named *.conf under conf.d/ — nginx would load them as servers.
      - ./nginx/api-locations.conf:/etc/nginx/includes/api-locations.conf:ro
      - ./nginx/spa-location.conf:/etc/nginx/includes/spa-location.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      auth:
        condition: service_healthy
      pm:
        condition: service_healthy
      previsit:
        condition: service_healthy
      calibration:
        condition: service_healthy
      installation:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eform

networks:
  eform:
    driver: bridge
