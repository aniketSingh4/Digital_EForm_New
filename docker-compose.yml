services:
  auth:
    build:
      context: ./Authentication-System
      dockerfile: dockerfile
    container_name: eform-auth
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    expose:
      - "8080"
    networks:
      - eform

  pm:
    build:
      context: ./PM-Service-Reports
      dockerfile: Dockerfile
    container_name: eform-pm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    expose:
      - "8080"
    networks:
      - eform

  previsit:
    build:
      context: ./Pre-Visit-Report-Form
      dockerfile: Dockerfile
    container_name: eform-previsit
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    volumes:
      - ./data/previsit-uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - eform

  calibration:
    build:
      context: ./Calibration-Report
      dockerfile: Dockerfile
    container_name: eform-calibration
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    expose:
      - "8080"
    networks:
      - eform

  installation:
    build:
      context: ./Installation-Commisioning-Report
      dockerfile: Dockerfile
    container_name: eform-installation
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    volumes:
      - ./data/installation-uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - eform

  nginx:
    image: nginx:alpine
    container_name: eform-nginx
    restart: unless-stopped
    ports:
      # Avoid 80/443 — this VPS already has other Nginx/app stacks.
      # Access APIs at http://72.60.74.221:9080/api/...
      - "${NGINX_HTTP_PORT:-9080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      auth:
        condition: service_healthy
      pm:
        condition: service_healthy
      previsit:
        condition: service_healthy
      calibration:
        condition: service_healthy
      installation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eform

networks:
  eform:
    driver: bridge
