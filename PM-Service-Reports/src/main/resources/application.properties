spring.application.name=PM-Service-Reports
server.port=8090

# JWT (must match Authentication-System)
jwt.secret=${JWT_SECRET:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdBbmRWYWxpZGF0aW9uMTIzNDU2Nzg5MA==}

# PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/Digital_EForm
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable Hidden HTTP Methods (PUT, DELETE)
spring.mvc.hiddenmethod.filter.enabled=true
logging.level.org.springframework.security=DEBUG

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Optional
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

## THREAD STARVATION DETECTOR CONFIGURATION
## ============================================
## Enable/disable (default: true)
#thread.starvation.enabled=true
#
## How often to check for issues (default: 60000ms = 1 minute)
#thread.starvation.detectionInterval=60000
#
## HikariCP Monitoring - will auto-detect your DataSource
#thread.starvation.hikari.enabled=true
#thread.starvation.hikari.warningThreshold=5000
#
## Thread Pool Monitoring
#thread.starvation.threadPool.enabled=true
#
## Clock Leap Detection
#thread.starvation.clockLeap.enabled=true
#thread.starvation.clockLeap.maxDeltaThreshold=60000
#thread.starvation.clockLeap.warningThreshold=10000
#
## Request Timing (slow request detection)
#thread.starvation.requestTiming.enabled=true
#thread.starvation.requestTiming.slowRequestThreshold=3000
#thread.starvation.requestTiming.verySlowRequestThreshold=10000
#
## Logging level for the detector
#logging.level.com.florosense.thread_starvation=INFO



