spring.application.name=Installation-Commisioning-Report
server.port=8086

# PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/Digital_EForm
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Add this line to help Hibernate handle LOBs correctly
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========================================
# DATABASE CONNECTION POOL
# ========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# Date format configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# ========================================
# STATIC RESOURCES - FOR IMAGES
# ========================================
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:./uploads/
spring.web.resources.cache.period=3600

# ========================================
# MULTIPART FILE UPLOAD
# ========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.location=./uploads/temp

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ========================================
# LOGGING
# ========================================
logging.level.com.florosense.installation_commissioning=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

