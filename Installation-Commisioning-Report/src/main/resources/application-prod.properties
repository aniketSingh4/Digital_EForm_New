spring.application.name=Installation-Commisioning-Report

# Database Configuration - Use environment variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================================
# DATABASE CONNECTION POOL (Added)
# ========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1

# Date format configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# ========================================
# STATIC RESOURCES - FOR IMAGES
# ========================================
spring.web.resources.add-mappings=true
# Use an absolute path or well-defined path in production
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:./uploads/
spring.web.resources.cache.period=3600

# ========================================
# MULTIPART FILE UPLOAD
# ========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Use system temp directory - files will be lost on restart
spring.servlet.multipart.location=${java.io.tmpdir}/uploads/temp

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.florosense.installation_commissioning=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT (must match Authentication-System)
jwt.secret=${JWT_SECRET}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://digitalform.florosense.com}

# Actuator (Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
