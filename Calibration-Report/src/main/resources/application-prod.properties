spring.application.name=Calibration-Report

# Database Configuration - Use environment variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Date format configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Multipart (if needed for file uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.root=INFO
logging.level.com.florosense.calibration=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT (must match Authentication-System)
jwt.secret=${JWT_SECRET}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://digitalform.florosense.com}

# Actuator (Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
