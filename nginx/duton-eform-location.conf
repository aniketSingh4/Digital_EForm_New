# Paste this inside duton-nginx's existing server { listen 80; } block
# (and the listen 443 block if you use HTTPS there).
# Do not replace the whole duton config.
#
# From a browser: http://72.60.74.221/eform/api/auth/login
# Strips /eform and forwards to eform-nginx.
#
# duton-nginx must reach eform-nginx. Either:
#   docker network connect eform_eform duton-nginx
# and use the first proxy_pass, or use host-gateway 172.17.0.1:9080.

location /eform/ {
    proxy_pass http://eform-nginx:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}
