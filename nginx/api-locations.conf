# Shared /api and /uploads proxy locations. Included from server blocks in default.conf.
# Do not put this file in conf.d/ — nginx auto-loads *.conf there as full configs.

location /api/auth {
    proxy_pass http://auth:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /api/notifications {
    proxy_pass http://auth:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /api/pm_reports {
    proxy_pass http://pm:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /api/previsit-reports {
    proxy_pass http://previsit:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /api/calibration-reports {
    proxy_pass http://calibration:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /api/installation-reports {
    proxy_pass http://installation:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /uploads/previsit-images/ {
    proxy_pass http://previsit:8080;
    include /etc/nginx/conf.d/proxy_params;
}

location /uploads/installation-images/ {
    proxy_pass http://installation:8080;
    include /etc/nginx/conf.d/proxy_params;
}
