# Public entry: SPA (eform-frontend) + path-based reverse proxy to the five APIs.
# HTTPS: after Let's Encrypt files exist under nginx/certs/live/, uncomment the
# named HTTP-redirect server AND the 443 server together (see deploy/hostinger.md).
# Nginx fails to start if the cert files are missing.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# IP and (until TLS is enabled) the public hostname.
# http://72.60.74.221/ and http://digitalform.florosense.com/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/includes/api-locations.conf;
    include /etc/nginx/includes/spa-location.conf;
}

