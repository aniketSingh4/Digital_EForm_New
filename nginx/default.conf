# Path-based reverse proxy for the five Spring Boot APIs.
# HTTPS: after placing Let's Encrypt files in nginx/certs/, uncomment the
# ssl_certificate lines in the server block below (see deploy/hostinger.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/auth {
        proxy_pass http://auth:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/notifications {
        proxy_pass http://auth:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/pm_reports {
        proxy_pass http://pm:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/previsit-reports {
        proxy_pass http://previsit:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/calibration-reports {
        proxy_pass http://calibration:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/installation-reports {
        proxy_pass http://installation:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /uploads/previsit-images/ {
        proxy_pass http://previsit:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /uploads/installation-images/ {
        proxy_pass http://installation:8080;
        include /etc/nginx/conf.d/proxy_params;
    }

    location / {
        default_type text/plain;
        return 200 'eform-api\n';
    }
}

